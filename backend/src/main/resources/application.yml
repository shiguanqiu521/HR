server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: hr-employee
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:127.0.0.1}:3306/${MYSQL_DATABASE:hr_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=60000&autoReconnect=true&failOverReadOnly=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MysqlHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 900000
      idle-timeout: 300000
      keepalive-time: 120000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.hr: INFO

hr:
  auth:
    jwt-secret: ${HR_AUTH_JWT_SECRET:hr-employee-jwt-secret-key-change-me-in-production-2026}
    token-ttl-minutes: 720
    default-username: admin
    default-password: admin123
    default-display-name: 系统管理员
