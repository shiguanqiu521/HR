<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - 人员管理系统</title>
    <link rel="stylesheet" href="libs/element-plus.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .dept-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dept-search { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <!-- 登录页 -->
    <div v-if="auth.view === 'login'" class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-logo">HR</span>
                <h1>人员管理系统</h1>
                <p>Employee Management System</p>
            </div>
            <el-form ref="loginFormRef" :model="loginForm" :rules="loginRules" size="large" class="login-form" @submit.prevent>
                <el-form-item prop="username">
                    <el-input v-model="loginForm.username" placeholder="请输入用户名" clearable maxlength="50" @keyup.enter="handleLogin">
                        <template #prefix><el-icon><user /></el-icon></template>
                    </el-input>
                </el-form-item>
                <el-form-item prop="password">
                    <el-input v-model="loginForm.password" type="password" placeholder="请输入密码" show-password maxlength="64" @keyup.enter="handleLogin">
                        <template #prefix><el-icon><lock /></el-icon></template>
                    </el-input>
                </el-form-item>
                <el-button type="primary" size="large" class="login-submit" :loading="loginLoading" @click="handleLogin">
                    {{ loginLoading ? '登录中...' : '登 录' }}
                </el-button>
            </el-form>
            <div class="login-tip">
                <span class="dot" :class="apiOnline ? 'dot-on' : 'dot-off'"></span>
                {{ apiOnline ? '后端已连接' : '正在连接后端...' }}
                <em>默认账号 admin / admin123</em>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <template v-else>
        <header class="app-header">
            <div class="app-header-inner">
                <div class="brand">
                    <span class="brand-logo">HR</span>
                    <div>
                        <h1>人员管理系统</h1>
                        <p>Employee Management System</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="api-state">
                        <span class="dot" :class="apiOnline ? 'dot-on' : 'dot-off'"></span>
                        {{ apiOnline ? '后端已连接' : '后端未连接' }}
                    </div>
                    <div class="user-area">
                        <el-icon><user-filled /></el-icon>
                        <span class="user-name">{{ currentUserLabel }}</span>
                        <el-button size="small" text class="logout-btn" @click="handleLogout">
                            <el-icon><switch-button /></el-icon>&nbsp;退出登录
                        </el-button>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-main">
            <!-- 导航标签 -->
            <el-tabs v-model="activeTab" type="border-card" class="nav-tabs">
                <el-tab-pane label="员工管理" name="employee">
                    <el-card shadow="never" class="panel">
                        <el-form :inline="true" :model="query" class="search-form" @submit.prevent>
                            <el-form-item label="姓名">
                                <el-input v-model="query.name" placeholder="支持模糊查询" clearable style="width: 200px" @keyup.enter="handleSearch" @clear="handleSearch"></el-input>
                            </el-form-item>
                            <el-form-item label="部门">
                                <el-input v-model="query.department" placeholder="支持模糊查询" clearable style="width: 200px" @keyup.enter="handleSearch" @clear="handleSearch"></el-input>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="handleSearch"><el-icon><search /></el-icon>&nbsp;查询</el-button>
                                <el-button @click="handleReset"><el-icon><refresh /></el-icon>&nbsp;重置</el-button>
                            </el-form-item>
                        </el-form>
                        <div class="toolbar">
                            <el-button type="primary" @click="openCreate"><el-icon><plus /></el-icon>&nbsp;新增员工</el-button>
                            <span class="total-tip">共 <b>{{ total }}</b> 条记录</span>
                        </div>
                        <el-table :data="list" v-loading="loading" border stripe empty-text="暂无员工数据">
                            <el-table-column type="index" label="序号" width="70" align="center" :index="indexMethod"></el-table-column>
                            <el-table-column prop="name" label="姓名" width="110" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="phone" label="手机号" width="140"></el-table-column>
                            <el-table-column prop="department" label="部门" width="130" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="position" label="岗位" min-width="150" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="hireDate" label="入职时间" width="120" align="center"></el-table-column>
                            <el-table-column prop="status" label="状态" width="100" align="center">
                                <template #default="scope"><el-tag :type="statusTagType(scope.row.status)" size="small" effect="light">{{ scope.row.status }}</el-tag></template>
                            </el-table-column>
                            <el-table-column prop="updatedAt" label="更新时间" width="180" align="center"></el-table-column>
                            <el-table-column label="操作" width="200" align="center" fixed="right">
                                <template #default="scope">
                                    <el-button link type="primary" size="small" @click="openDetail(scope.row)">详情</el-button>
                                    <el-button link type="primary" size="small" @click="openEdit(scope.row)">编辑</el-button>
                                    <el-button link type="danger" size="small" @click="handleDelete(scope.row)">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                        <div class="pager">
                            <el-pagination background layout="total, sizes, prev, pager, next, jumper" :total="total" :current-page="query.page" :page-size="query.size" :page-sizes="[5, 10, 20, 50]" @current-change="handlePageChange" @size-change="handleSizeChange"></el-pagination>
                        </div>
                    </el-card>
                </el-tab-pane>

                <!-- 部门管理 -->
                <el-tab-pane label="部门管理" name="department">
                    <el-card shadow="never" class="panel">
                        <div class="dept-header">
                            <el-input v-model="deptQuery.name" placeholder="搜索部门名称" clearable style="width: 300px" @keyup.enter="loadDepartments" @clear="loadDepartments">
                                <template #prefix><el-icon><search /></el-icon></template>
                            </el-input>
                            <el-button type="primary" @click="openDeptCreate"><el-icon><plus /></el-icon>&nbsp;新增部门</el-button>
                        </div>
                        <el-table :data="deptList" v-loading="deptLoading" border stripe empty-text="暂无部门数据">
                            <el-table-column type="index" label="序号" width="70" align="center"></el-table-column>
                            <el-table-column prop="name" label="部门名称" min-width="150" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="manager" label="负责人" width="120" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="description" label="描述" min-width="200" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="createdAt" label="创建时间" width="180" align="center"></el-table-column>
                            <el-table-column label="操作" width="180" align="center" fixed="right">
                                <template #default="scope">
                                    <el-button link type="primary" size="small" @click="openDeptEdit(scope.row)">编辑</el-button>
                                    <el-button link type="danger" size="small" @click="handleDeptDelete(scope.row)">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                        <div class="total-tip" style="margin-top: 20px;">共 <b>{{ deptList.length }}</b> 个部门</div>
                    </el-card>
                </el-tab-pane>
            </el-tabs>
        </main>

        <!-- 员工表单对话框 -->
        <el-dialog v-model="dialogVisible" :title="dialogTitle" width="580px" :close-on-click-modal="false" @closed="handleDialogClosed">
            <el-form ref="formRef" :model="form" :rules="rules" label-width="90px">
                <el-form-item label="姓名" prop="name"><el-input v-model="form.name" placeholder="请输入姓名" maxlength="50" show-word-limit></el-input></el-form-item>
                <el-form-item label="手机号" prop="phone"><el-input v-model="form.phone" placeholder="请输入11位手机号" maxlength="11"></el-input></el-form-item>
                <el-form-item label="部门" prop="department">
                    <el-select v-model="form.department" placeholder="请选择或直接输入部门" filterable allow-create default-first-option style="width: 100%">
                        <el-option v-for="d in departments" :key="d" :label="d" :value="d"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="岗位" prop="position"><el-input v-model="form.position" placeholder="请输入岗位" maxlength="50"></el-input></el-form-item>
                <el-form-item label="入职时间" prop="hireDate"><el-date-picker v-model="form.hireDate" type="date" placeholder="请选择入职时间" value-format="YYYY-MM-DD" style="width: 100%"></el-date-picker></el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-radio-group v-model="form.status"><el-radio v-for="s in statusOptions" :key="s" :value="s">{{ s }}</el-radio></el-radio-group>
                </el-form-item>
            </el-form>
            <template #footer><el-button @click="dialogVisible = false">取消</el-button><el-button type="primary" :loading="submitting" @click="handleSubmit">确定</el-button></template>
        </el-dialog>

        <!-- 员工详情抽屉 -->
        <el-drawer v-model="detailVisible" title="员工详情" size="440px">
            <div v-loading="detailLoading">
                <el-descriptions v-if="detail" :column="1" border>
                    <el-descriptions-item label="员工ID">{{ detail.id }}</el-descriptions-item>
                    <el-descriptions-item label="姓名">{{ detail.name }}</el-descriptions-item>
                    <el-descriptions-item label="手机号">{{ detail.phone }}</el-descriptions-item>
                    <el-descriptions-item label="部门">{{ detail.department }}</el-descriptions-item>
                    <el-descriptions-item label="岗位">{{ detail.position }}</el-descriptions-item>
                    <el-descriptions-item label="入职时间">{{ detail.hireDate }}</el-descriptions-item>
                    <el-descriptions-item label="状态"><el-tag :type="statusTagType(detail.status)" size="small">{{ detail.status }}</el-tag></el-descriptions-item>
                    <el-descriptions-item label="创建时间">{{ detail.createdAt }}</el-descriptions-item>
                    <el-descriptions-item label="更新时间">{{ detail.updatedAt }}</el-descriptions-item>
                </el-descriptions>
            </div>
            <template #footer><el-button @click="detailVisible = false">关闭</el-button><el-button type="primary" @click="editFromDetail">编辑该员工</el-button></template>
        </el-drawer>

        <!-- 部门表单对话框 -->
        <el-dialog v-model="deptDialogVisible" :title="deptDialogTitle" width="500px" :close-on-click-modal="false" @closed="handleDeptDialogClosed">
            <el-form ref="deptFormRef" :model="deptForm" :rules="deptRules" label-width="90px">
                <el-form-item label="部门名称" prop="name"><el-input v-model="deptForm.name" placeholder="请输入部门名称" maxlength="100" show-word-limit></el-input></el-form-item>
                <el-form-item label="负责人" prop="manager"><el-input v-model="deptForm.manager" placeholder="请输入负责人姓名" maxlength="50"></el-input></el-form-item>
                <el-form-item label="描述" prop="description"><el-input v-model="deptForm.description" type="textarea" :rows="3" placeholder="请输入部门描述" maxlength="200" show-word-limit></el-input></el-form-item>
            </el-form>
            <template #footer><el-button @click="deptDialogVisible = false">取消</el-button><el-button type="primary" :loading="deptSubmitting" @click="handleDeptSubmit">确定</el-button></template>
        </el-dialog>
    </template>
</div>

<script src="libs/vue.global.prod.js"></script>
<script src="libs/element-plus.full.min.js"></script>
<script src="libs/element-plus-icons.iife.min.js"></script>
<script src="libs/zh-cn.js"></script>
<script src="app.js"></script>
</body>
</html>
