# 认证模块测试数据

login_success:
  username: "admin"
  password: "admin123"
  expected:
    http_status: 200
    code: 200
    message: "success"
    token_type: "Bearer"
    expires_in: 43200
    username: "admin"
    display_name: "系统管理员"

login_fail_cases:
  - case_name: "用户名不存在"
    username: "nonexistent"
    password: "admin123"
    expected:
      http_status: 401
      message_contains: "用户名或密码错误"

  - case_name: "密码错误"
    username: "admin"
    password: "wrongpwd"
    expected:
      http_status: 401
      message_contains: "用户名或密码错误"

  - case_name: "用户名为空"
    username: ""
    password: "admin123"
    expected:
      http_status: 401
      message_contains: "用户名或密码错误"

  - case_name: "密码为空"
    username: "admin"
    password: ""
    expected:
      http_status: 401
      message_contains: "用户名或密码错误"

login_boundary_cases:
  - case_name: "username超50字符"
    username_length: 51
    expected:
      http_status: [400, 401]

  - case_name: "password超100字符"
    password_length: 101
    expected:
      http_status: [400, 401]
