# 接口用例覆盖率归因配置（由 tests/coverage_gate.py 读取）
# 所有相对路径以仓库根目录（docker-compose.yml 所在目录）为基准。

backend_pom: backend/pom.xml            # mvn 的工作对象，同时决定 classfiles/sourcefiles 位置

# 出报告前，用"实际运行的那份字节码"替换 backend/target/classes。
# JaCoCo 按 class id（类文件内容哈希）匹配执行数据与字节码：本地 javac 与构建镜像的 JDK
# 补丁版本不同就会产出不同字节，id 不一致的类被静默丢弃、报告显示 0 覆盖且不报错。
# 2026-11-17 实测因此丢掉了整个 EmployeeService（49 行）。
deploy:
  mode: ssh                                 # ssh=本机驱动远端部署，现取（需免密）；file=CI/同机，只读 local_jar 落盘的部署产物
  ssh: root@106.12.144.134                  # mode=ssh：能执行 docker exec 的目标；本机部署可留空并改用 --build
  container: hr-backend                     # 容器名；mode=file 时只用于拼出错提示里的 docker cp 命令
  jar: /app/app.jar                         # 容器内的可执行 jar 路径
  classes_prefix: BOOT-INF/classes/         # Spring Boot 可执行 jar 内的应用类目录
  local_jar: backend/target/deployed/app.jar  # mode=file：部署步骤落盘的同一份字节码，
                                            #   docker cp hr-backend:/app/app.jar backend/target/deployed/app.jar
                                            # 落盘而不是现取，是为了让 runner 容器不用挂 docker.sock（那等于交出宿主机 root）

jacoco:
  version: "0.8.11"                     # 必须与 backend/pom.xml 的 jacoco-maven-plugin 版本一致
  package_prefix: com.hr.               # 只统计被测系统自身的包，第三方库不计入
  dump:
    host: 127.0.0.1                     # JaCoCo tcpserver 地址；远端部署时先建 SSH 隧道再保持本值
    port: 6300
    retry_count: 10                     # 后端刚重启时的连接重试次数
  exec_file: backend/target/jacoco-api.exec # 接口用例通道专用；与 prepare-agent 的 jacoco.exec 分开，report 由脚本显式传 dataFile
  report_dir: backend/target/site/jacoco

gate:
  output_dir: tests/reports/coverage    # 报告归档目录（已 gitignore）
  exclude_packages: []                  # 口径已定（2026-11-18）：dto/model/common/config 等一并计入门禁，不豁免
  thresholds:                           # 由 --update-thresholds 按实测值向下取整写入；低于现有下限时不写回（棘轮只升不降）
    line: 70                            # 2026-11-18 接口收敛后重建部署，稳态干净单轮 321/458=70.09%（125 passed 同轮）
    branch: 70                          # 同轮实测 70.00%（56/80）；接口收敛不改变分支总数，收敛前后一致
